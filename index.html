<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午餐會來賓名單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8EF;
    --desk:#E7E2D3;
    --ink:#2C2A22;
    --ink-soft:#6B6656;
    --line:#CFC8AE;
    --green:#4C7A5E;
    --green-bg:#E7EFE7;
    --amber:#B4812C;
    --amber-bg:#F5ECD9;
    --red:#AA3A2E;
    --grey:#928C77;
    --grey-bg:#EDEAE0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--desk);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.05) 1px, transparent 0);
    background-size:14px 14px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    padding:28px 12px 60px;
    display:flex;
    justify-content:center;
  }
  .ticket{
    position:relative;
    width:100%;
    max-width:460px;
    background:var(--paper);
    box-shadow:0 12px 28px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.08);
    padding:26px 22px 30px;
  }
  .ticket::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-11px; height:11px;
    background:
      linear-gradient(-45deg, var(--paper) 8px, transparent 0) 0 0/16px 16px repeat-x,
      linear-gradient(45deg, var(--paper) 8px, transparent 0) 0 0/16px 16px repeat-x;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .head{
    text-align:center;
    padding-bottom:14px;
    border-bottom:1px dashed var(--line);
  }
  .head .kicker{
    font-size:11px;
    letter-spacing:3px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .head h1{
    font-size:20px;
    margin:0 0 8px;
    font-weight:700;
    letter-spacing:1px;
  }
  .head .date-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .head .date-row input{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    border:none;
    background:transparent;
    color:var(--ink);
    text-align:center;
    width:110px;
    border-bottom:1px dotted transparent;
  }
  .head .date-row input:disabled{ pointer-events:none; }
  body.editmode .head .date-row input{ border-bottom-color:var(--line); }

  .summary{
    display:flex;
    justify-content:space-between;
    padding:14px 2px 12px;
    border-bottom:1px dashed var(--line);
    font-size:12px;
  }
  .summary .stat{ text-align:center; flex:1; }
  .summary .stat .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:22px;
    font-weight:600;
    display:block;
  }
  .summary .stat .lbl{ color:var(--ink-soft); }

  .section{ padding-top:16px; }
  .section-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
    margin-bottom:8px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .dot.green{ background:var(--green); }
  .dot.amber{ background:var(--amber); }
  .dot.grey{ background:var(--grey); }
  .section-title .count{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
  }

  .rows{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
    column-gap:10px;
    row-gap:4px;
  }
  .row{
    display:flex;
    align-items:flex-start;
    gap:3px;
    padding:4px 0;
    min-width:0;
  }
  .row .name{
    font-weight:500;
    font-size:14px;
    line-height:1.3;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    padding:0;
    width:100%;
    min-width:0;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
    border-bottom:1px dotted transparent;
    outline:none;
    pointer-events:none;
  }
  body.editmode .row .name{
    pointer-events:auto;
    cursor:text;
    border-bottom-color:var(--line);
  }
  .row .rm{ margin-top:1px; }
  .row.absent .name{ color:var(--grey); text-decoration:line-through; text-decoration-color:var(--line); }
  .row.fixed .name{ color:var(--grey); font-style:italic; }
  .row .rm{
    display:none;
    flex:none;
    border:none; background:none; color:var(--red);
    font-size:13px; cursor:pointer; padding:0 0 0 2px; line-height:1;
  }
  body.editmode .row .rm{ display:inline-block; }
  body.editmode .rows{ grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); }
  .row select{
    display:none;
    flex:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:3px;
    padding:1px;
    max-width:56px;
  }
  body.editmode .row select{ display:inline-block; }

  .empty-hint{ font-size:12.5px; color:var(--ink-soft); padding:4px 0 2px; }

  .totalline{
    margin-top:18px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:15px;
  }
  .timestamp{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:6px;
    letter-spacing:1px;
  }

  .addform{
    display:none;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
    flex-wrap:wrap;
    gap:6px;
  }
  body.editmode .addform{ display:flex; }
  .addform input, .addform select{
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  .addform input[name="name"]{ flex:1 1 90px; }
  .addform input[name="dish"]{ flex:1 1 80px; }
  .addform select{ flex:1 1 80px; }
  .addform button{
    flex:1 1 100%;
    padding:8px;
    border:none;
    border-radius:4px;
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    letter-spacing:1px;
  }

  .lockbar{
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .lockbar button, .lockbar input{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:4px 9px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .lockbar .togglebtn{ background:none; border-color:transparent; }
  .lockbar .pinbox{ display:none; gap:6px; align-items:center; }
  .lockbar.pending .pinbox{ display:flex; }
  .lockbar.pending .togglebtn{ display:none; }
  .lockbar input[type="password"]{ width:70px; cursor:text; }
  .status-msg{
    width:100%;
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    min-height:0;
  }
  body.editmode .lockbar .togglebtn{ color:var(--green); }
</style>
</head>
<body>

<div class="ticket" id="ticket">
  <div class="head">
    <div class="kicker">LUNCH GUEST LIST</div>
    <h1 id="eventTitle">午餐會來賓名單</h1>
  </div>

  <div id="sections"></div>

  <div class="addform" id="addForm">
    <input type="text" name="name" placeholder="姓名" required>
    <button id="addBtn">＋ 新增來賓</button>
  </div>

  <div class="timestamp" id="lastUpdate">載入中…</div>

  <div class="lockbar" id="lockbar">
    <button class="togglebtn" id="toggleEditBtn">🔒 編輯</button>
    <div class="pinbox">
      <input type="password" id="pinInput" placeholder="密碼" inputmode="numeric">
      <button id="pinSubmit">解鎖</button>
      <button id="pinCancel">✕</button>
    </div>
    <span class="status-msg" id="pinMsg"></span>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyHbArS5WkaOLThay9qqJwJkOJpesp9cIUbmP2ScQFjO6ATl3zoiSkDlY2xdqn1gJTOtA/exec';
const EDIT_PIN = '0000';

const SEED = {
  eventTitle: '午餐會來賓名單',
  eventDate: '6/18',
  guests: [
    '彥漢','秀華','雅雯','豪雷','銓興哥','林湛','吉昇','閔翔','政宏','大衛','張淑惠','鄭志明',
    '美玲','冠禎','Cindy姐','佳頤',
    '天維','關崇仁','莊敬','黎大哥','麗文8815','欣美姐','俊維','家銘','顏志龍',
    '宗諺','懿恬','鴻華','守愚','世德','士斌','淑慧'
  ].map(name => ({id:g(), name}))
};

function g(){ return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let data = null;
let editing = false;
let refreshTimer = null;

async function loadData(){
  try{
    const res = await fetch(API_URL, {method:'GET'});
    const json = await res.json();
    if(json && json.guests){
      data = json;
    } else if(!data){
      data = SEED;
      await saveData(false);
    }
  }catch(e){
    if(!data){
      data = SEED;
    }
    setPinMsg('⚠️ 讀取失敗，顯示暫存版本');
  }
  render();
}

async function saveData(bumpTimestamp = true){
  if(bumpTimestamp) data.updatedAt = new Date().toISOString();
  try{
    await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(data)
    });
  }catch(e){
    setPinMsg('⚠️ 儲存失敗：' + (e && e.message ? e.message : '網路錯誤'));
  }
}

function setPinMsg(msg){
  document.getElementById('pinMsg').textContent = msg || '';
}

function render(){
  if(!data) return;
  document.getElementById('eventTitle').textContent = data.eventTitle || '午餐會來賓名單';

  const guests = data.guests || [];
  const wrap = document.getElementById('sections');
  wrap.innerHTML = '';

  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-title">
      <span>來賓</span>
      <span class="count mono">${guests.length} 人</span>
    </div>
    <div class="rows"></div>
  `;
  const rowsEl = sec.querySelector('.rows');
  if(guests.length === 0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '（目前沒有人）';
    rowsEl.appendChild(hint);
  } else {
    guests.forEach(gu => rowsEl.appendChild(buildRow(gu)));
  }
  wrap.appendChild(sec);

  const ts = data.updatedAt ? new Date(data.updatedAt) : null;
  document.getElementById('lastUpdate').textContent = ts
    ? '最後更新　' + ts.toLocaleString('zh-TW', {hour12:false})
    : '尚未更新';
}

function buildRow(gu){
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <div class="name" contenteditable="true" spellcheck="false"></div>
    <button class="rm" title="刪除">✕</button>
  `;
  const nameEl = row.querySelector('.name');
  nameEl.textContent = gu.name;
  nameEl.addEventListener('blur', async () => {
    const newName = nameEl.textContent.trim();
    if(!newName){ nameEl.textContent = gu.name; return; }
    if(newName === gu.name) return;
    gu.name = newName;
    await saveData();
  });
  nameEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); nameEl.blur(); }
  });
  row.querySelector('.rm').addEventListener('click', async () => {
    data.guests = data.guests.filter(x => x.id !== gu.id);
    await saveData();
    render();
  });
  return row;
}

// --- edit mode / pin ---
const lockbar = document.getElementById('lockbar');
document.getElementById('toggleEditBtn').addEventListener('click', () => {
  lockbar.classList.add('pending');
  document.getElementById('pinInput').value = '';
  setPinMsg('');
  document.getElementById('pinInput').focus();
});
document.getElementById('pinCancel').addEventListener('click', () => {
  lockbar.classList.remove('pending');
  setPinMsg('');
});
document.getElementById('pinSubmit').addEventListener('click', tryUnlock);
document.getElementById('pinInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });

function tryUnlock(){
  const val = document.getElementById('pinInput').value;
  if(val === EDIT_PIN){
    editing = true;
    document.body.classList.add('editmode');
    lockbar.classList.remove('pending');
    document.getElementById('toggleEditBtn').textContent = '🔓 鎖定';
    setPinMsg('已解鎖，可編輯');
    stopAutoRefresh();
  } else {
    setPinMsg('密碼錯誤');
  }
}

document.getElementById('toggleEditBtn').addEventListener('click', function relock(){
  if(editing){
    editing = false;
    document.body.classList.remove('editmode');
    this.textContent = '🔒 編輯';
    setPinMsg('已鎖定');
    startAutoRefresh();
  }
});

document.getElementById('addBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  const form = document.getElementById('addForm');
  const name = form.querySelector('[name="name"]').value.trim();
  if(!name){ setPinMsg('請輸入姓名'); return; }
  data.guests.push({id:g(), name});
  form.querySelector('[name="name"]').value = '';
  await saveData();
  render();
});

function startAutoRefresh(){
  stopAutoRefresh();
  refreshTimer = setInterval(() => { if(!editing) loadData(); }, 30000);
}
function stopAutoRefresh(){
  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
}

loadData().then(startAutoRefresh);
</script>
</body>
</html>
